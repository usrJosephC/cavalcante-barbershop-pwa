services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cavalcante_barbershop
    ports:
      - "5432:5432"
    volumes:
      - cavalcante_barbershop_pgdata:/var/lib/postgresql/data

volumes:
  cavalcante_barbershop_pgdata:
